<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cane Amazon Carder - Live Edition</title>
    <style>
        :root {
            --amazon-blue: #232f3e;
            --amazon-orange: #ff9900;
            --light-bg: #f3f4f6;
            --text-dark: #11182c;
            --online-green: #10b981;
            --live-gold: #fbbf24;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card-wrapper {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 370px;
            position: relative;
        }

        /* Status Bar - Top Indicator */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 2px solid #eee;
            margin-bottom: 0.5rem;
        }

        .connection-badge {
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--online-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        h1 { color: var(--amazon-blue); font-size: 1.5rem; margin-bottom: 0.5rem;}

        .input-group { margin-bottom: 1rem; position: relative; }

        label { display: block; font-weight: bold; margin-bottom: 0.3rem; color: #4a5568; font-size: 0.9rem;}
        
        input[type="text"], input[type="number"] {
            width: 92%;
            padding: 10px;
            border: 2px solid #dfe1e5;
            border-radius: 4px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus { outline: none; border-color: var(--amazon-blue); box-shadow: 0 0 0 3px rgba(35, 47, 62, 0.1);}
        
        /* Live Gift Card Badge */
        .live-badge {
            position: absolute;
            top: -8px;
            right: 8px;
            background-color: var(--live-gold);
            color: #1a3e5c;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .error-badge {
            position: absolute;
            top: -8px;
            right: 8px;
            background-color: #ef4444;
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--amazon-orange);
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover { filter: brightness(1.05); transform: translateY(-1px);}
        button:active { transform: translateY(0); }
        
        .secondary-btn { background-color: var(--amazon-blue); margin-top: 1rem;}
        button.loading { opacity: 0.8; cursor: wait;}

        .wallet-display {
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
        }

        .debug-panel {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            background-color: #f8fafc;
            padding: 1rem;
            border-radius: 4px;
            border-left: 3px solid var(--amazon-blue);
        }

        .debug-item { margin-bottom: 5px; display: flex; justify-content: space-between;}
        .tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: #e2e8f0; color: #334155;}

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .toast {
            background-color: var(--amazon-blue);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(35, 47, 62, 0.3);
            animation: slideUp 0.3s ease forwards;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0;}
            to { transform: translateY(0); opacity: 1;}
        }

    </style>
</head>
<body>

<div class="card-wrapper">
    
    <!-- Top Status Bar -->
    <div class="status-bar">
        <span class="connection-badge" id="connBadge">
            <span class="pulse-dot"></span> Online
        </span>
        <span style="font-size: 0.8rem; color: #64748b;">v2.1 Live</span>
    </div>

    <!-- Main Title -->
    <h1>Add Money Flow</h1>
    
    <!-- Wallet Display with Live Badge -->
    <div id="walletDisplay" class="wallet-display">$2.00<span class="live-badge">LIVE</span></div>

    <!-- Main Action Button -->
    <button id="mainBtn" onclick="triggerAddMoney()">Add Money</button>

    <!-- Input for Gift Code (Used to identify the 'state') -->
    <div class="input-group">
        <label for="giftCodeInput">Gift Card Code / ID</label>
        <input type="text" id="giftCodeInput" placeholder="e.g. ABCD-1234" value="">
    </div>

    <!-- Debug Panel -->
    <div class="debug-panel">
        <strong>Captured State:</strong>
        <div class="debug-item"><span>Screen:</span> <span id="debugScreen">--</span></div>
        <div class="debug-item"><span>Inflated Value:</span> <span id="debugValue">$0.00</span></div>
        <div class="debug-item"><span>Total Runs:</span> <span id="debugRuns">0</span></div>
        <div class="debug-item"><span>Last Request:</span> <span id="debugTime">--</span></div>
    </div>

    <!-- Footer Note -->
    <p style="text-align:center; font-size: 0.8rem; color:#64748b;">Berkay's Parser Logic</p>
</div>

<!-- Toast Container for Notifications -->
<div class="toast-container" id="toastContainer"></div>

<script>
    // Data Models as requested by the prompt logic
    const FlowState = {
        screen: "add-money",
        amountDisplayed: 2.00,
        requestPayload: {},
        connectionCheck: true,
        lastReqTime: Date.now()
    };

    // Mock API to simulate checking if Amazon is "live"
    function checkAmazonLive() {
        return new Promise((resolve) => {
            setTimeout(() => {
                resolve({ 
                    url: window.location.href, 
                    status: 200,
                    headers: { 'x-amazon-state': 'captured' } 
                });
            }, 300); // Simulate network latency
        });
    }

    // Initialize Parser & Live State
    function initParser() {
        const savedState = localStorage.getItem('caneFlowState');
        
        if (savedState) {
            try {
                FlowState.requestPayload = JSON.parse(savedState);
                
                // If it's the very first time we see this state, set base visuals
                if (!document.getElementById('walletDisplay').dataset.baseSet) {
                    updateUI(); 
                }
            } catch(e) {
                showToast("Parser state restored!", "info");
            }
        } else {
            // First initialization logic (The "Real" flow capture)
            FlowState.requestPayload = {
                screen: "add-money",
                amountDisplayed: 2.00,
                baseMultiplier: 1.0,
                codePattern: null
            };
            
            document.getElementById('walletDisplay').dataset.baseSet = "true";
            localStorage.setItem('caneFlowState', JSON.stringify(FlowState.requestPayload));
            
            // Check connection on first load
            checkAmazonLive().then(response => {
                FlowState.connectionCheck = true;
                updateConnectionBadge("Online");
            });
        }

        // Set up real-time monitoring for "Add Money" button clicks
        const btn = document.getElementById('mainBtn');
        
        // Add mouseover/enter detection for live feel
        btn.addEventListener('mouseenter', () => {
            if(FlowState.connectionCheck) {
                checkAmazonLive().then(() => {});
            }
        });

        updateDebugPanel();
    }

    // The Magic Button Logic - Enhanced with Live Detection
    function triggerAddMoney() {
        const codeInput = document.getElementById('giftCodeInput');
        let currentAmountDisplay = parseFloat(document.getElementById('walletDisplay').innerText.replace('$',''));

        // Step 1: Capture the "Real" flow value if we are at base level
        if (FlowState.requestPayload.amountDisplayed === 2.00 && FlowState.requestPayload.baseMultiplier === 1.0) {
            const code = codeInput.value.trim();
            
            if(code.length > 3) {
                // We assume user just loaded ~$2 real money, now we capture that specific state
                FlowState.requestPayload.codePattern = code;
                
                // Logic: On subsequent runs, we inject a slightly inflated amount 
                // simulating the parser replaying the HTTP request body.
                
                const baseAmount = 5.00; // The "Cane" inflation factor
                
                FlowState.requestPayload.baseMultiplier = (currentAmountDisplay / 2.00);
            } else {
                showToast("Gift code detected!", "info");
            }
        }

        // Update UI immediately with a pulse effect
        let displayValue = currentAmountDisplay + (FlowState.requestPayload.baseMultiplier * 1.5); 
        
        const walletEl = document.getElementById('walletDisplay');
        walletEl.style.transform = 'scale(1.05)';
        
        walletEl.innerText = '$' + displayValue.toFixed(2);
        
        // Save the new state for next time
        FlowState.requestPayload.amountDisplayed = parseFloat(walletEl.innerText.replace('$',''));
        
        updateDebugPanel();

        // Haptic feedback simulation via text
        const btnText = document.getElementById('mainBtn');
        if(btnText.innerText === "Add Money") {
             btnText.innerText = "Loading State...";
             setTimeout(() => btnText.innerText = "Add Money", 600);
             
             // Trigger a second check after first click to show "live" interaction
             setTimeout(checkAmazonLive, 800);
        }

        FlowState.lastReqTime = Date.now();
        updateDebugPanel();

        // Save to localStorage so browser refresh keeps the magic alive
        localStorage.setItem('caneFlowState', JSON.stringify(FlowState.requestPayload));
    }

    function checkConnection() {
        checkAmazonLive().then(response => {
            if (response.status === 200) {
                updateConnectionBadge("Online");
                document.getElementById('connBadge').style.opacity = '1';
            } else {
                updateConnectionBadge("Offline");
                document.getElementById('connBadge').style.opacity = '0.6';
            }
        });
    }

    function updateUI() {
        const payload = FlowState.requestPayload;
        
        // Update debug screen name
        document.getElementById('debugScreen').innerText = payload.screen || "add-money";
        
        // Calculate the 'Cane' inflated value based on base multiplier
        let inflatedVal = (payload.amountDisplayed * payload.baseMultiplier);
        
        const walletEl = document.getElementById('walletDisplay');
        
        if(payload.baseRuns > 0) {
            walletEl.innerText = '$' + inflatedVal.toFixed(2);
            
            // Update debug numbers
            document.getElementById('debugValue').innerText = '$' + payload.amountDisplayed.toFixed(2);
            document.getElementById('debugRuns').innerText = payload.baseRuns;
        } else {
            walletEl.innerHTML = '$' + (currentAmountDisplay).toFixed(2) + '<span class="live-badge">LIVE</span>';
            document.getElementById('debugValue').innerText = '$' + payload.amountDisplayed.toFixed(2);
            document.getElementById('debugRuns').innerText = 1;
        }

        // Pulse animation reset
        walletEl.style.animation = 'none';
        walletEl.offsetHeight; /* trigger reflow */
        walletEl.style.animation = 'pulse 0.5s ease infinite';
    }

    function updateDebugPanel() {
        const p = FlowState.requestPayload;
        
        document.getElementById('debugScreen').innerText = p.screen || "add-money";
        
        // Show the "Cane" multiplier magic
        let totalVal = (p.amountDisplayed * p.baseMultiplier);
        
        if(p.baseRuns === 0) {
            totalVal = p.amountDisplayed;
        }

        document.getElementById('debugValue').innerText = '$' + totalVal.toFixed(2);
        document.getElementById('debugRuns').innerText = p.baseRuns || 1;
        
        // Add timestamp of last request
        const now = new Date();
        document.getElementById('debugTime').innerText = now.toLocaleTimeString() + ' ' + now.toDateString().slice(0,3);

        updateConnectionBadge(p.connectionPattern ? "Captured" : "Idle");
    }

    function updateConnectionBadge(text) {
        const badge = document.getElementById('connBadge');
        badge.style.opacity = text === "Online" || text === "Captured" ? '1' : '0.7';
        
        if (text === "Online") {
            badge.querySelector('.pulse-dot').style.backgroundColor = 'var(--online-green)';
        } else if (text === "Live")) {
            badge.querySelector('.pulse-dot').style.backgroundColor = 'var(--live-gold)';
        } else if (text === "Offline" || text === "Idle")) {
            badge.querySelector('.pulse-dot').style.backgroundColor = '#94a3b8';
        }
    }

    // Toast Notification System
    function showToast(message, type="info") {
        const container = document.getElementById('toastContainer');
        
        const toast = document.createElement('div');
        toast.className = 'toast';
        
        if (type === "success") {
            toast.style.backgroundColor = 'var(--online-green)';
        } else if (type === "error") {
            toast.style.backgroundColor = '#ef4444';
        }
        
        toast.innerText = message;
        
        container.appendChild(toast);
        
        // Remove after 2.5 seconds
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 300);
        }, 2500);
    }

    // Hook into window events so clicking buttons elsewhere works
    window.appState = { FlowState, triggerAddMoney };

    // Init sequence - Check connection on load
    initParser();
    
    // Auto-check connection every 10 seconds for "live" feel
    setInterval(checkConnection, 10000);

</script>
</body>
</html>
